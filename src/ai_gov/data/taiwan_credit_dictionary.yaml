# Data dictionary for UCI "Default of Credit Card Clients" (Yeh, 2009; UCI dataset 350, CC BY 4.0),
# paraphrased from the variable list on the dataset page. The target column is renamed DEFAULT.
# valid_values / valid_range encode what the dictionary documents; rows outside are reported by the check.
ID:
  description: Row identifier assigned in the published file
  type: integer
  personal_data: true
  role: identifier
LIMIT_BAL:
  description: Amount of given credit in NT dollars, individual plus family/supplementary credit
  type: integer
  personal_data: true
  role: feature
  valid_range:
  - 0
  - 10000000
SEX:
  description: 'Gender: 1 = male, 2 = female'
  type: categorical
  personal_data: true
  role: protected_attribute
  valid_values:
  - 1
  - 2
EDUCATION:
  description: 'Education: 1 = graduate school, 2 = university, 3 = high school, 4 = others'
  type: categorical
  personal_data: true
  role: feature
  valid_values:
  - 1
  - 2
  - 3
  - 4
MARRIAGE:
  description: 'Marital status: 1 = married, 2 = single, 3 = others'
  type: categorical
  personal_data: true
  role: feature
  valid_values:
  - 1
  - 2
  - 3
AGE:
  description: Age in years
  type: integer
  personal_data: true
  role: feature_and_proxy
  valid_range:
  - 18
  - 100
PAY_0:
  description: 'Repayment status in September 2005: -1 = paid duly, 1 to 8 = months of payment delay, 9 = nine months or more'

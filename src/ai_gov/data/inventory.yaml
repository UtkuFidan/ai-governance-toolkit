systems:
  - id: AI-001
    name: Explainable card-fraud scoring (gradient-boosted trees)
    status: production
    owner: Head of Fraud Analytics
    purpose: Rank card transactions by fraud risk and attach a reason code to each flag for investigators.
    users: [Fraud investigators, Fraud model owners]
    affected_persons: Card holders whose transactions are flagged
    data_categories: [transactional, customer_profile]
    model_type: XGBoost classifier with TreeSHAP reason codes
    provenance: in_house
    deployment: on_prem
    human_oversight:
      mode: human_in_the_loop
      description: An investigator reviews every flag before a card is blocked.
      can_override: true
    monitoring:
      frequency: monthly
      metrics: [PR-AUC, recall at review budget, PSI of score, alert volume]
      thresholds_defined: true
      last_review: 2026-09-30
    last_validation: 2026-03-12
    independent_validation: true
    documentation: [model card, validation report, threshold and cost memo, data dictionary]
    incidents: []
    related_project: explainable-fraud-detection
    questionnaire:
      annex_iii_use_case: "5(b)"
      used_only_for_fraud_detection: true
      role: provider_and_deployer

